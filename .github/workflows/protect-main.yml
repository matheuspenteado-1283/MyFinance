name: Protect Main

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify came from PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --state merged --base main --head develop --limit 1 --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            echo "❌ Push direto para main bloqueado. Use PR de develop → main."
            exit 1
          fi
          echo "✅ Promovido via PR #$PR"
